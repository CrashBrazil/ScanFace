name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ScanFace.slnx
      - run: dotnet test ScanFace.slnx --configuration Release --no-restore
      - name: Publish
        run: dotnet publish src/ScanFace.App/ScanFace.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/ScanFace-win-x64
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & $iscc "/DMyAppVersion=$version" installer/ScanFace.iss
      - name: Package and checksum
        shell: pwsh
        run: |
          Copy-Item artifacts/ScanFace-win-x64/ScanFace.exe artifacts/ScanFace.exe
          Compress-Archive -Path artifacts/ScanFace-win-x64/* -DestinationPath artifacts/ScanFace-win-x64.zip
          (Get-FileHash artifacts/ScanFace.exe -Algorithm SHA256).Hash + '  ScanFace.exe' | Set-Content artifacts/SHA256SUMS.txt
          (Get-FileHash artifacts/ScanFace-win-x64.zip -Algorithm SHA256).Hash + '  ScanFace-win-x64.zip' | Add-Content artifacts/SHA256SUMS.txt
          (Get-FileHash artifacts/ScanFace-Setup.exe -Algorithm SHA256).Hash + '  ScanFace-Setup.exe' | Add-Content artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/ScanFace.exe
            artifacts/ScanFace-Setup.exe
            artifacts/ScanFace-win-x64.zip
            artifacts/SHA256SUMS.txt
